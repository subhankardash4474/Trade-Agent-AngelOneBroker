# freeze-v2.1 battery queue — backtester VM scheduler config.
#
# Edit and reload by restarting the systemd unit:
#     sudo systemctl restart battery-scheduler
# The scheduler reads this file fresh on every (re)start, so adding new
# jobs is just "edit + restart".
#
# Each job:
#   * MUST have a unique `name`. The run_id is derived as
#     `battery_<name>_<utc_ts>` the first time we launch it.
#   * Inherits the defaults baked into tools/run_battery.py (interval
#     defaults to 5m, workers to 1) unless overridden here.
#   * Survives a VM reboot: the scheduler resumes incomplete runs via
#     the battery harness's own run_id-folder mechanism, and marks
#     completed jobs in data/battery_queue_state.json so they aren't
#     re-run.
#   * Optional `variants:` (list of variant names) runs ONLY that subset
#     of `packages/research/battery.py:VARIANTS`. Omit to run all.
#
# To force a job to re-run (e.g. after editing universe file), delete
# its entry from data/battery_queue_state.json and restart the unit.
#
# 2026-05-19 reorder rationale: nifty50_60d moved to slot #1 so the
# scheduler produces its first variant evidence in ~12-18h on the
# backtester VM (workers=2) instead of ~3-5 days for the v2 universe.
#
# 2026-05-25 long-only validation insertion. Slot #2 was the full
# v2_baseline_90d (~190h on workers=2 for all 19 variants). Replaced
# with a fast 6-variant 60d × 200-stock run that answers the three
# decision-affecting questions for the Friday 2026-05-29 review:
#   1. Does V4's 3% trend filter still win on a mid-cap-heavy universe?
#      (V1 + V4 control; nifty500_validation_60d slot)
#   2. Does the cheapest fix — `risk.allow_shorts: false` (V17) — beat
#      both V1 and V4 on the live-shaped universe?
#   3. Does V18 (V4 + long-only) stack on top of V4 or cancel it out?
#   4. Does V19 (filters off + long-only) reproduce V2's edge on a
#      different time window?
# Runtime estimate: 6 variants × ~14h ÷ 2 workers = ~42h. Completes
# Wed/Thu, ahead of Friday review.
#
# 2026-05-27 TRIM (audit-only, freeze-v2.1 docs-class). Rationale:
# the xgboost_classifier was disabled live in slot-2 yesterday (commit
# f32009c) because the 2026-05-14 .pkl was confirmed broken (forensic
# audit, see docs/findings/findings_log_2026-05-27.md §5). The four long-history
# v2_* jobs that previously sat in slots #3-6 of this queue were
# designed to characterise the SHIPPED ensemble across multiple
# windows / regimes. With xgboost out of strategies.active, those
# jobs would be re-validating a 4-strategy ensemble that's already
# strictly dominated by the upcoming retrained-xgboost path -- ~144h
# of backtester time spent on a question the retrain will moot.
#
# We keep:
#   * Slot #1 (nifty50_60d, all 19 variants)    — fast sanity ranking
#     of variant configs on the 4-strategy ensemble. Currently RUNNING.
#   * Slot #2 (validation_60d, 6 variants)      — Friday 2026-05-29
#     review evidence. Answers V4 vs V17 vs V18 vs V19 on the full
#     232-stock universe.
#   * Slot #3 (v2_holdout_30d, all 19 variants) — p-hack guard. If a
#     variant wins on slot #1's 60d window but crumbles on the last
#     30d, the slot-#1 result was overfit. Cheapest viable
#     train/holdout split.
#
# We drop (preserved in git history at commit prior-to-this):
#   * v2_baseline_90d            (~48h) — would re-validate broken
#                                  4-strategy ensemble; superseded
#                                  by post-retrain runs.
#   * v2_train_60d               (~32h) — train half of the
#                                  train/holdout split; redundant
#                                  given we keep just the holdout
#                                  (the holdout IS the p-hack guard
#                                  — train is already covered by
#                                  slot #1).
#   * v2_baseline_120d           (~64h) — longer-window
#                                  regime-dependence check; useful
#                                  only after retrain is live.
#
# Net compute saved: ~144h ≈ 6 days. Once the retrained xgboost model
# is qualified (sprint Day 4-5, see docs/diagnoses/diagnosis_sprint_2026-05-27.md),
# we will queue a SEPARATE block of long-history jobs that validate
# the new ensemble — those replace what we removed here, but on the
# post-retrain config rather than the broken-xgb config.

schema_version: 1

jobs:
  # ── 1. Smaller universe, faster turnaround (FIRST EVIDENCE) ─────────
  # Nifty 50 in 60d on workers=2 ~= 7h after the 2026-05-27 perf fixes
  # (P-03/P-04/P-11). Use this as the "is the harness even
  # producing variant rankings?" sanity check before committing the
  # backtester VM to multi-day v2 runs.
  - name: nifty50_60d
    days: 60
    interval: 5m
    workers: 2
    universe-file: tests/fixtures/nifty50_universe.json

  # ── 2. Long-only validation on mid-cap-heavy universe (2026-05-25) ──
  # Targeted 6-variant run that answers the V4-transfer + long-only
  # questions for the Friday 2026-05-29 review. See header for rationale.
  - name: nifty500_v4_long_only_validation_60d
    days: 60
    interval: 5m
    workers: 2
    universe-file: tests/fixtures/battery_v2_universe.json
    variants:
      - V1_baseline_current_shipped
      - V2_all_filters_off
      - V4_threshold_3pct
      - V17_long_only_shipped
      - V18_long_only_threshold_3pct
      - V19_long_only_filters_off

  # ── 3. Walk-forward HOLDOUT slice (2026-05-27 moved up) ──────────────
  # Last 30 of 90 days. P-hack guard: if any variant wins on slot #1's
  # 60d window (the de-facto TRAIN) but crumbles on this HOLDOUT,
  # the slot-#1 ranking was overfit and we discard the candidate.
  # Promoted from old slot #5 to slot #3 on 2026-05-27 because the
  # other three v2_* jobs were dropped (see header for rationale).
  - name: v2_holdout_30d
    days: 90
    interval: 5m
    workers: 2
    universe-file: tests/fixtures/battery_v2_universe.json
    holdout-window-days: 30

  # ── 4. POST-RETRAIN focus run — added 2026-05-29 18:05 IST ─────────
  # Operator-deliberate override of the AUC<0.55 hard-stop in
  # tools/cloud/run_retrain_on_backtester.sh. The retrained pkl
  # (xgboost_model_retrain_20260529T1225Z.pkl) had AUC 0.47 on the
  # 271k-sample 232-stock × 60d × 5m training run; the safety gate
  # therefore refused to swap it. We swapped manually on backtester
  # ONLY (trader VM untouched, xgboost_classifier disabled live; old
  # pkl backed up at xgboost_model_pre_override_20260529T1233Z.pkl).
  # Rationale + audit trail: docs/findings/findings_log_2026-05-27.md §5.10.2.
  #
  # This job runs the 5 variants whose behaviour depends on the pkl:
  #   * V1_baseline_current_shipped — control, NOT pkl-dependent. If
  #     V1's PnL / trade-count / PF on this run differs from slot-#3
  #     V1 by more than determinism noise, something else changed and
  #     the V3/V10/V11/V15 deltas can't be cleanly attributed to the
  #     retrain.
  #   * V3_only_xgb_mr_filtered_yday — XGB filters MR signals using
  #     yesterday's regime tag.
  #   * V10_confidence_060 — XGB confidence threshold 0.60 (tighter).
  #   * V11_confidence_050 — XGB confidence threshold 0.50 (looser).
  #   * V15_mr_xgb_only — pure MR-with-XGB-filter; the diagnostic-
  #     decisive variant from friday_review §10.
  #
  # Apples-to-apples vs slot-#3 (same universe, same window, only the
  # pkl changed). ETA ~12h on workers=2; signal Saturday morning.
  # Gating for the holdout follow-on (see commented entry below):
  #   * Focus V15 PF ≥ 0.95 → queue holdout-30d follow-on (~36h)
  #   * Focus V15 PF < 0.90 → confirm "no edge at model layer"; skip
  #     holdout, pivot fully to H3 entry-lag forensic.
  - name: post_retrain_xgb_focus_60d
    days: 60
    interval: 5m
    workers: 2
    universe-file: tests/fixtures/battery_v2_universe.json
    variants:
      - V1_baseline_current_shipped
      - V3_only_xgb_mr_filtered_yday
      - V10_confidence_060
      - V11_confidence_050
      - V15_mr_xgb_only

  # ── 5. POST-RETRAIN holdout-30d — DEFERRED 2026-05-29 18:05 IST ─────
  # Walk-forward holdout (Bug K commit 357b60d means workers will
  # actually see the slice this time). Deferred behind slot #4 focus
  # gating because (a) AUC=0.47 makes a 36h walk-forward unlikely to
  # surface edge, (b) we'd rather spend that compute on H3 entry-lag
  # forensic if the focus run confirms no model-layer edge. To activate
  # after focus result lands: uncomment + restart scheduler.
  #
  # - name: post_retrain_v2_holdout_30d
  #   days: 90
  #   interval: 5m
  #   workers: 2
  #   universe-file: tests/fixtures/battery_v2_universe.json
  #   holdout-window-days: 30

  # ── 6. v3.0 swing CNC battery — Phase A5 (2026-05-30) ───────────────
  # First v3.0 battery run. Per
  # docs/freeze/freeze_v3.0_charter_2026-05-30.md §6 Phase A5.
  # Five swing variants × 30 stocks × 1d bars. Universe:
  # data/v3_universe_top30.json (top 30 Nifty 50 by liquidity).
  #
  # Calendar-day window vs effective signal window:
  # ─────────────────────────────────────────────────
  # We download `days: 600` calendar days = ~430 trading days. The first
  # ~220 trading days are strategy warmup (trend_pullback's 200-DMA
  # filter needs 200+ bars before it can produce non-NaN values; the
  # ``required_history_bars=220`` guard short-circuits to HOLD
  # otherwise). Net effective signal-emission window is ~210 trading
  # days, which comfortably exceeds the charter §6.5 "180-day"
  # spec. Without this padding the 180d window would be ENTIRELY
  # consumed by warmup and zero trades would fire — a silent failure
  # mode that would look like "v3 has no signal".
  #
  # Estimated runtime on workers=2: ~60-120 min for ~430 trading days
  # × 30 stocks × 5 variants. Still 7-14x faster than the 5-min
  # equivalent (where 600 calendar days × 75 bars/day = 32k bars/symbol
  # = ~14h+ on workers=2).
  #
  # Variant set:
  #   * V20_swing_pullback_only      — Rule 1 alone
  #   * V21_swing_breakout_only      — Rule 2 alone
  #   * V22_swing_combined           — both rules (charter default)
  #   * V23_swing_combined_loose     — both rules, loosened thresholds
  #   * V24_swing_combined_tight     — both rules, tightened thresholds
  #
  # Phase A5 read-out (per charter §6.5):
  #   * All 5 variants PF >= 1.5 with >= 30 trades        → strong;
  #     proceed to walk-forward holdout (separate slot, deferred).
  #   * V22 PF 1.0-1.5 but V20 or V21 alone PF >= 1.5     → ship the
  #     better single rule, drop the worse.
  #   * All variants PF < 1.0                              → SURPRISE.
  #     Either swing CNC isn't the answer or there's a backtester
  #     bug. Read once, sleep, decide whether to try a different
  #     rule set or pivot the pivot. Per charter §10.5 R1 we should
  #     budget for 1-2 surprise backtester bugs at the daily-bar path
  #     not previously exercised; do NOT debug into oblivion.
  #
  # Phase B gate is HARD (charter §7.1): ALL six conditions must hold
  # before the trader VM is touched. This slot satisfies condition (1)
  # and contributes evidence toward (2). Conditions (3)-(6) are
  # separate work items.
  #
  # Trader VM remains untouched throughout this run (charter §6.1).
  - name: v3_swing_a5_180d_eff
    days: 600
    interval: 1d
    workers: 2
    universe-file: data/v3_universe_top30.json
    variants:
      - V20_swing_pullback_only
      - V21_swing_breakout_only
      - V22_swing_combined
      - V23_swing_combined_loose
      - V24_swing_combined_tight
