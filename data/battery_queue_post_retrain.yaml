--- # ── Post-retrain battery queue addendum (DRAFT) ──────────────────────
# Append these jobs to data/battery_queue.yaml AFTER tools/cloud/run_retrain_on_backtester.sh
# reports "GO -- retrain complete". The scheduler picks them up on the next
# `sudo systemctl restart battery-scheduler.service`.
#
# Rationale (2026-05-29 retrain decision, see findings_log §5.10.1):
#
# Slot #3 (just finished, broken-pkl baseline) ran all 19 variants on 232
# stocks × 60d. After retrain, we want to know:
#   1. Did the new pkl flip V15 / V10 / V11 / V3 (the xgb-using variants)
#      from net-negative to net-positive?  → Job A: xgb-focus 5 variants
#      ETA ~12h, signal by Sunday morning.
#   2. Does the new pkl produce real walk-forward evidence on the bigger
#      universe (Bug K fix means workers will actually see the slice)?
#      → Job B: 19 variants × 232 stocks × 90d source × 30d holdout slice.
#      ETA ~30-40h, completes Tue/Wed next week.
#
# Both jobs use the SAME 232-stock v4 universe + 5m interval as the
# pre-retrain runs, so the apples-to-apples comparison is preserved.
#
# Combined budget: ~50h (workers=2). With slot-3 finishing tonight ~17 IST
# and the retrain completing ~17:30 IST, Job A should land Saturday morning
# (~05-08 IST), Job B by Wed early morning. Friday 2026-06-05 review has 2
# days of buffer for analysis.

jobs:

  # ── 4. xgb-focus retrain comparison (FAST early signal) ─────────────────
  # 5 variants on 232 stocks × 60d × 5m. Same universe + window as slot-#3
  # so the only changing variable is the pkl. V15 is the diagnostic-decisive
  # variant from the 2026-05-29 friday_review §10 verdict; V3 / V10 / V11
  # also exercise xgboost_classifier with different filters / thresholds.
  # V1 is the control (no xgb dependency) — if V1 differs vs slot-3 V1 by
  # more than determinism noise, something else changed and we need to
  # investigate before trusting the V15-V3-V10-V11 deltas.
  - name: post_retrain_xgb_focus_60d
    days: 60
    interval: 5m
    workers: 2
    universe-file: tests/fixtures/battery_v2_universe.json
    variants:
      - V1_baseline_current_shipped
      - V3_only_xgb_mr_filtered_yday
      - V10_confidence_060
      - V11_confidence_050
      - V15_mr_xgb_only

  # ── 5. Walk-forward holdout (Bug K fix actually applied this time) ──────
  # All 19 variants × 232 stocks × 90 source days, sliced to last 30d.
  # First production-grade walk-forward evidence in this trading-agent
  # repo (Bug K commit 357b60d landed today; previously
  # --holdout-window-days was silently ignored in the parallel-worker
  # path — see findings_log_2026-05-27.md §9 for the post-mortem).
  # Comparable variant ranking to slot-3 but on a strictly held-out
  # window — the canonical p-hack guard.
  - name: post_retrain_v2_holdout_30d
    days: 90
    interval: 5m
    workers: 2
    universe-file: tests/fixtures/battery_v2_universe.json
    holdout-window-days: 30

# To activate (after retrain GO):
#   1. cat data/battery_queue_post_retrain.yaml >> data/battery_queue.yaml
#      (or copy the two `- name:` blocks into the live queue file by hand)
#   2. sudo systemctl restart battery-scheduler.service
#   3. Verify: tools/battery_status_remote.ps1 should show the queue
#      now contains 5 jobs (3 DONE + 2 QUEUE).
